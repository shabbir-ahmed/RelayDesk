name: Verify RelayDesk

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx --no-install playwright install --with-deps chromium
      - name: Start the disposable PostgreSQL databases
        run: |
          cp .env.example .env
          docker compose up -d --wait db
          docker compose exec -T db createdb -U relaydesk relaydesk_test
      - run: npm run verify
      - name: Build both release images
        run: |
          docker build --target runtime -t "relaydesk:${GITHUB_SHA}" .
          docker build --target migration -t "relaydesk-migration:${GITHUB_SHA}" .
      - name: Print database logs if a check fails
        if: failure()
        run: docker compose logs db
