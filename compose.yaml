x-database-url: &database-url postgresql://relaydesk:relaydesk@db:5432/relaydesk?connection_limit=4
x-runtime: &runtime
  image: relaydesk:local
  build:
    context: .
    target: runtime
  init: true

services:
  db:
    image: postgres:15.20-bookworm@sha256:72ccb1ad4dc9d5813ea40a8c1c87af746f16658fb029c17fe570ea9b881f68b3
    environment:
      POSTGRES_USER: relaydesk
      POSTGRES_PASSWORD: relaydesk
      POSTGRES_DB: relaydesk
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relaydesk -d relaydesk']
      interval: 3s
      timeout: 3s
      retries: 15

  migrate:
    image: relaydesk-migration:local
    build:
      context: .
      target: migration
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *runtime
    environment:
      DATABASE_URL: *database-url
      RELAYDESK_MODE: ${RELAYDESK_MODE:-private}
      APP_ORIGIN: ${APP_ORIGIN:?Copy .env.example to .env and set APP_ORIGIN}
      OPERATOR_CREDENTIAL: ${OPERATOR_CREDENTIAL:-}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      API_TOKEN: ${API_TOKEN:-}
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 15

  worker:
    <<: *runtime
    command: ['node', 'dist/src/worker/main.js']
    environment:
      DATABASE_URL: *database-url
      RELAYDESK_MODE: ${RELAYDESK_MODE:-private}
      DESTINATION_SIGNING_KEY: ${DESTINATION_SIGNING_KEY:-}
      RECEIVER_BASE_URL: http://web:3000
      RECEIVER_SECRET: ${RECEIVER_SECRET:-}
    depends_on:
      web:
        condition: service_healthy
    stop_grace_period: 10s

volumes:
  pgdata:
