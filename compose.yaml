services:
  db:
    image: postgres:15.20-bookworm
    environment:
      POSTGRES_USER: relaydesk
      POSTGRES_PASSWORD: relaydesk
      POSTGRES_DB: relaydesk
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U relaydesk -d relaydesk']
      interval: 3s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
